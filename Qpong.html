<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RETRO PONG CONSOLE</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    :root {
      --console-bg: #2a2a2a;
      --bezel-bg: #111;
      --screen-bg: #050505;
      --phosphor: #e0e0e0;
      --glow: #a8d8ea;
      --led-off: #3a0000;
      --led-on: #ff3333;
      --p1-color: #4aff4a;
      --p2-color: #4affff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #151515;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Press Start 2P', monospace;
      color: var(--phosphor);
      overflow: hidden;
    }

    /* Console Body */
    .console {
      background: var(--console-bg);
      padding: 20px;
      border-radius: 24px;
      box-shadow: 
        0 20px 50px rgba(0,0,0,0.8),
        inset 0 2px 5px rgba(255,255,255,0.1),
        inset 0 -2px 5px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      position: relative;
      border: 4px solid #1a1a1a;
    }

    .console::before {
      content: "PONGMASTER 76 ~ TDF micro-visions";
      position: absolute;
      top: 6px;
      left: 30px;
      font-size: 8px;
      color: #666;
      letter-spacing: 2px;
    }

    /* Screen Bezel */
    .screen-bezel {
      background: var(--bezel-bg);
      padding: 15px;
      border-radius: 16px;
      box-shadow: inset 0 5px 15px rgba(0,0,0,0.8);
      position: relative;
    }

    /* CRT Screen */
    .screen {
      position: relative;
      width: 800px;
      height: 500px;
      background: var(--screen-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: inset 0 0 60px rgba(0,0,0,0.9);
    }

    canvas {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      display: block;
    }

    /* Scanlines & CRT Effects */
    .crt-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: 
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
      z-index: 2;
    }

    .crt-vignette {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.4) 100%);
      pointer-events: none;
      z-index: 3;
    }

    /* UI Overlay */
    .ui-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      background: rgba(0,0,0,0.75);
      transition: opacity 0.3s;
    }
    .ui-overlay.hidden { opacity: 0; pointer-events: none; }

    .ui-title {
      font-size: 48px;
      color: var(--glow);
      text-shadow: 0 0 15px var(--glow);
      margin-bottom: 20px;
      letter-spacing: 4px;
    }
    .ui-sub {
      font-size: 16px;
      color: #fff;
      animation: blink 1s infinite;
      margin-bottom: 30px;
    }
    .ui-winner {
      font-size: 24px;
      color: #ffcc00;
      text-shadow: 0 0 10px #ffcc00;
      margin-bottom: 20px;
      display: none;
    }
    .ui-controls {
      font-size: 12px;
      color: #888;
      text-align: center;
      line-height: 1.6;
    }

    @keyframes blink { 50% { opacity: 0.3; } }

    /* Scoreboard */
    .scoreboard {
      position: absolute;
      top: 20px;
      left: 0; width: 100%;
      display: flex;
      justify-content: space-around;
      z-index: 5;
      font-size: 32px;
      pointer-events: none;
      text-shadow: 0 0 10px rgba(255,255,255,0.5);
    }

    /* Console Controls */
    .console-controls {
      display: flex;
      gap: 20px;
      margin-top: 10px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .btn {
      width: 40px; height: 40px;
      background: #333;
      border-radius: 50%;
      box-shadow: 0 4px 6px rgba(0,0,0,0.5), inset 0 2px 3px rgba(255,255,255,0.1);
      border: 2px solid #222;
    }
    .btn:active { transform: scale(0.95); box-shadow: inset 0 2px 5px rgba(0,0,0,0.8); }
    .label { font-size: 10px; color: #666; letter-spacing: 1px; }

    .power-led {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--led-off);
      box-shadow: 0 0 5px var(--led-off);
      transition: all 0.3s;
    }
    .power-led.on {
      background: var(--led-on);
      box-shadow: 0 0 8px var(--led-on);
    }

    /* Responsive */
    @media (max-width: 850px) {
      .screen { width: 90vw; height: 56.25vw; max-width: 800px; max-height: 500px; }
    }
  </style>
</head>
<body>

  <div class="console">
    <div class="screen-bezel">
      <div class="screen">
        <canvas id="pong" width="800" height="500"></canvas>
        <div class="crt-overlay"></div>
        <div class="crt-vignette"></div>
        
        <div class="scoreboard">
          <span id="score-p1" style="color:var(--p1-color)">0</span>
          <span id="score-p2" style="color:var(--p2-color)">0</span>
        </div>

        <div class="ui-overlay" id="overlay">
          <div class="ui-title">PONG</div>
          <div class="ui-winner" id="winner-text"></div>
          <div class="ui-sub" id="start-text">PRESS SPACE TO START</div>
          <div class="ui-controls">
            ▲ ▼ MOVE PADDLE<br>
            SPACE START / RESTART
          </div>
        </div>
      </div>
    </div>

    <div class="console-controls">
      <div class="btn-group">
        <div class="btn" id="btn-start"></div>
        <div class="label">START</div>
      </div>
      <div class="btn-group">
        <div class="power-led" id="power-led"></div>
        <div class="label">POWER</div>
      </div>
      <div class="btn-group">
        <div class="btn" id="btn-reset"></div>
        <div class="label">RESET</div>
      </div>
    </div>
  </div>

  <script>
    // --- CONFIG ---
    const canvas = document.getElementById('pong');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const winnerText = document.getElementById('winner-text');
    const startText = document.getElementById('start-text');
    const scoreP1 = document.getElementById('score-p1');
    const scoreP2 = document.getElementById('score-p2');
    const powerLed = document.getElementById('power-led');

    const WIN_SCORE = 11;
    const PADDLE_W = 12, PADDLE_H = 90;
    const BALL_SIZE = 12;
    const AI_SPEED = 3.5;
    const INITIAL_BALL_SPEED = 5;
    const MAX_BALL_SPEED = 12;

    // --- STATE ---
    let gameState = 'MENU'; // MENU, PLAYING, GAME_OVER
    let p1Y = 205, p2Y = 205;
    let ballX = 400, ballY = 250, ballVX = 0, ballVY = 0;
    let score1 = 0, score2 = 0;
    let keys = { ArrowUp: false, ArrowDown: false, Space: false };
    let audioCtx = null;

    // --- AUDIO ---
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      powerLed.classList.add('on');
    }

    function playTone(freq, type, duration, vol = 0.15) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    const SOUNDS = {
      paddle: () => playTone(440, 'square', 0.1),
      wall: () => playTone(220, 'square', 0.1),
      score: () => playTone(660, 'square', 0.25),
      win: () => {
        setTimeout(() => playTone(523, 'square', 0.15), 0);
        setTimeout(() => playTone(659, 'square', 0.15), 150);
        setTimeout(() => playTone(784, 'square', 0.3), 300);
      },
      lose: () => {
        setTimeout(() => playTone(392, 'square', 0.2), 0);
        setTimeout(() => playTone(311, 'square', 0.2), 200);
        setTimeout(() => playTone(261, 'square', 0.4), 400);
      }
    };

    // --- INPUT ---
    window.addEventListener('keydown', e => {
      if (keys.hasOwnProperty(e.code)) keys[e.code] = true;
      if (e.code === 'Space') {
        e.preventDefault();
        initAudio();
        if (gameState === 'MENU') startGame();
        else if (gameState === 'GAME_OVER') resetGame();
      }
    });
    window.addEventListener('keyup', e => {
      if (keys.hasOwnProperty(e.code)) keys[e.code] = false;
    });

    // --- GAME LOGIC ---
    function startGame() {
      if (gameState !== 'MENU') return;
      gameState = 'PLAYING';
      overlay.classList.add('hidden');
      resetBall();
    }

    function resetGame() {
      score1 = 0; score2 = 0;
      updateScores();
      gameState = 'MENU';
      overlay.classList.remove('hidden');
      startText.style.display = 'block';
      winnerText.style.display = 'none';
      resetBall();
      powerLed.classList.remove('on');
    }

    function resetBall() {
      ballX = 400; ballY = 250;
      let dir = Math.random() > 0.5 ? 1 : -1;
      let speed = INITIAL_BALL_SPEED;
      ballVX = dir * speed;
      ballVY = (Math.random() * 4 - 2) * 0.5;
    }

    function updateScores() {
      scoreP1.textContent = score1;
      scoreP2.textContent = score2;
    }

    function update() {
      if (gameState !== 'PLAYING') return;

      // Player Movement
      if (keys.ArrowUp) p1Y -= 7;
      if (keys.ArrowDown) p1Y += 7;
      p1Y = Math.max(0, Math.min(canvas.height - PADDLE_H, p1Y));

      // AI Movement
      let targetY = ballY - PADDLE_H / 2;
      let diff = targetY - p2Y;
      p2Y += Math.sign(diff) * Math.min(Math.abs(diff), AI_SPEED);
      p2Y = Math.max(0, Math.min(canvas.height - PADDLE_H, p2Y));

      // Ball Movement
      ballX += ballVX;
      ballY += ballVY;

      // Wall Collision (Top/Bottom)
      if (ballY <= BALL_SIZE/2 || ballY >= canvas.height - BALL_SIZE/2) {
        ballVY *= -1;
        ballY = ballY <= BALL_SIZE/2 ? BALL_SIZE/2 : canvas.height - BALL_SIZE/2;
        SOUNDS.wall();
      }

      // Paddle Collision (Left/Player 1)
      if (ballX - BALL_SIZE/2 <= 30 && ballX - BALL_SIZE/2 >= 15 && 
          ballY >= p1Y && ballY <= p1Y + PADDLE_H) {
        ballVX = Math.min(Math.abs(ballVX) + 0.5, MAX_BALL_SPEED);
        let hitPos = (ballY - (p1Y + PADDLE_H/2)) / (PADDLE_H/2);
        ballVY = hitPos * 5;
        ballX = 30 + BALL_SIZE/2 + 1;
        SOUNDS.paddle();
      }

      // Paddle Collision (Right/CPU)
      if (ballX + BALL_SIZE/2 >= canvas.width - 30 && ballX + BALL_SIZE/2 <= canvas.width - 15 &&
          ballY >= p2Y && ballY <= p2Y + PADDLE_H) {
        ballVX = -(Math.min(Math.abs(ballVX) + 0.5, MAX_BALL_SPEED));
        let hitPos = (ballY - (p2Y + PADDLE_H/2)) / (PADDLE_H/2);
        ballVY = hitPos * 5;
        ballX = canvas.width - 30 - BALL_SIZE/2 - 1;
        SOUNDS.paddle();
      }

      // Scoring
      if (ballX < 0) {
        score2++;
        updateScores();
        SOUNDS.score();
        checkWin();
        if (gameState === 'PLAYING') resetBall();
      } else if (ballX > canvas.width) {
        score1++;
        updateScores();
        SOUNDS.score();
        checkWin();
        if (gameState === 'PLAYING') resetBall();
      }
    }

    function checkWin() {
      if (score1 >= WIN_SCORE) {
        gameState = 'GAME_OVER';
        winnerText.textContent = 'PLAYER 1 WINS!';
        winnerText.style.display = 'block';
        winnerText.style.color = 'var(--p1-color)';
        startText.style.display = 'block';
        overlay.classList.remove('hidden');
        SOUNDS.win();
      } else if (score2 >= WIN_SCORE) {
        gameState = 'GAME_OVER';
        winnerText.textContent = 'CPU WINS!';
        winnerText.style.display = 'block';
        winnerText.style.color = 'var(--p2-color)';
        startText.style.display = 'block';
        overlay.classList.remove('hidden');
        SOUNDS.lose();
      }
    }

    // --- DRAW ---
    function draw() {
      // Clear
      ctx.fillStyle = '#050505';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Center Line
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 2;
      ctx.setLineDash([15, 15]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Paddles
      ctx.fillStyle = '#e0e0e0';
      ctx.shadowBlur = 15;
      ctx.shadowColor = 'rgba(255,255,255,0.3)';
      ctx.fillRect(15, p1Y, PADDLE_W, PADDLE_H);
      ctx.fillRect(canvas.width - 27, p2Y, PADDLE_W, PADDLE_H);

      // Ball
      ctx.beginPath();
      ctx.arc(ballX, ballY, BALL_SIZE/2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // --- LOOP ---
    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
