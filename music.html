<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apology Remastered — Music from another world</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        /* Theme — distinct from the main TDF dashboard. Warmer, nocturnal. */
        :root {
            --bg-deep: #0b0a10;
            --bg-panel: rgba(22, 20, 32, 0.78);
            --fg: #ece9f5;
            --fg-muted: #9b96b3;
            --accent: #b388ff;   /* violet */
            --accent-2: #ff77c6; /* magenta */
            --border: rgba(179, 136, 255, 0.22);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-deep);
            color: var(--fg);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .font-display { font-family: 'Orbitron', sans-serif; }

        /* Background layers */
        .bg-image {
            position: fixed; inset: 0; z-index: 0;
            background: url('./mySongs/background.png') no-repeat center center/cover;
            filter: brightness(0.35) saturate(1.1);
        }
        .bg-overlay {
            position: fixed; inset: 0; z-index: 1;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(179,136,255,0.12) 0%, transparent 55%),
                radial-gradient(ellipse at 80% 90%, rgba(255,119,198,0.08) 0%, transparent 45%),
                linear-gradient(180deg, rgba(11,10,16,0.5) 0%, rgba(11,10,16,0.92) 100%);
        }

        .content {
            position: relative; z-index: 10;
            min-height: 100vh;
            width: 100%; max-width: 1500px;
            margin: 0 auto;
            display: flex; flex-direction: column;
            padding: 40px clamp(1rem, 5vw, 4rem) 120px;
        }

        /* Header */
        .header {
            display: flex; flex-direction: column; align-items: center;
            text-align: center; gap: 0.75rem;
            margin-bottom: 2.5rem;
        }
        .header img {
            width: clamp(120px, 18vw, 200px);
            aspect-ratio: 1; object-fit: cover; border-radius: 16px;
            box-shadow: 0 0 40px rgba(179,136,255,0.45), 0 10px 30px rgba(0,0,0,0.6);
            border: 1px solid var(--border);
        }
        .header h1 {
            font-size: clamp(2.2rem, 7vw, 4rem);
            font-weight: 900; letter-spacing: 0.12em; text-transform: uppercase;
            text-shadow: 0 0 18px rgba(179,136,255,0.6), 0 0 50px rgba(255,119,198,0.3);
        }
        .header p {
            color: var(--fg-muted); font-size: clamp(0.9rem, 2vw, 1.15rem);
            letter-spacing: 0.15em; text-transform: uppercase;
        }

        /* Back link */
        .top-nav { align-self: flex-start; margin-bottom: 1.5rem; }
        .back-link {
            display: inline-flex; align-items: center; gap: 0.5rem;
            color: var(--fg-muted); text-decoration: none; font-size: 0.8rem;
            letter-spacing: 0.1em; text-transform: uppercase;
            border: 1px solid var(--border); border-radius: 6px;
            padding: 0.5rem 1rem; transition: all 0.3s ease;
        }
        .back-link:hover { color: var(--accent); border-color: var(--accent); }

        /* Playlist toolbar */
        .toolbar {
            display: flex; flex-wrap: wrap; gap: 0.75rem 1rem;
            align-items: center; justify-content: space-between;
            margin-bottom: 1.75rem;
            background: var(--bg-panel); border: 1px solid var(--border);
            border-radius: 10px; padding: 1rem 1.25rem;
            backdrop-filter: blur(6px);
        }
        .toolbar-info { font-size: 0.8rem; color: var(--fg-muted); letter-spacing: 0.05em; }
        .toolbar-info strong { color: var(--accent); }
        .toolbar-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .btn {
            font-family: 'JetBrains Mono', monospace;
            background: transparent; color: var(--fg);
            border: 1px solid var(--border); border-radius: 6px;
            padding: 0.5rem 1rem; font-size: 0.75rem; letter-spacing: 0.08em;
            text-transform: uppercase; cursor: pointer; transition: all 0.25s ease;
        }
        .btn:hover { border-color: var(--accent); color: var(--accent); }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #0b0a10; border: none; font-weight: 700;
        }
        .btn-primary:hover { color: #0b0a10; filter: brightness(1.1); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Song grid */
        .panels {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem; width: 100%;
        }

        .card {
            position: relative;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            text-decoration: none; color: inherit;
            display: flex; flex-direction: column;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }
        .card:hover {
            transform: translateY(-6px);
            border-color: var(--accent);
            box-shadow: 0 16px 40px rgba(0,0,0,0.6), 0 0 26px rgba(179,136,255,0.35);
        }
        .card-cover {
            position: relative; aspect-ratio: 1; overflow: hidden;
        }
        .card-cover img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.5s ease;
        }
        .card:hover .card-cover img { transform: scale(1.06); }
        /* Selection checkbox overlay */
        .card-select {
            position: absolute; top: 10px; left: 10px; z-index: 2;
            display: flex; align-items: center; gap: 0.4rem;
            background: rgba(11,10,16,0.7); backdrop-filter: blur(4px);
            border: 1px solid var(--border); border-radius: 6px;
            padding: 0.3rem 0.5rem; cursor: pointer;
            font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase;
            color: var(--fg-muted); user-select: none;
        }
        .card-select input { accent-color: var(--accent); width: 14px; height: 14px; cursor: pointer; }
        .card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(179,136,255,0.5), 0 0 26px rgba(179,136,255,0.3); }
        .card.selected .card-select { color: var(--accent); }
        .card-body {
            padding: 1rem 1.1rem 1.25rem; flex: 1;
            display: flex; flex-direction: column; gap: 0.4rem;
        }
        .card-title {
            font-family: 'Orbitron', sans-serif; font-weight: 700;
            font-size: 1.05rem; letter-spacing: 0.06em;
        }
        .card-snippet {
            font-size: 0.7rem; color: var(--fg-muted); line-height: 1.5;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-open {
            margin-top: 0.5rem; font-size: 0.65rem; color: var(--accent);
            letter-spacing: 0.1em; text-transform: uppercase;
        }

        /* Sticky player */
        .player {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
            background: rgba(11,10,16,0.96); backdrop-filter: blur(12px);
            border-top: 1px solid var(--border);
            transform: translateY(110%);
            transition: transform 0.4s cubic-bezier(0.25,0.46,0.45,0.94);
        }
        .player.visible { transform: translateY(0); }
        .player-inner {
            max-width: 1500px; margin: 0 auto;
            padding: 0.85rem clamp(1rem, 5vw, 4rem);
            display: flex; flex-wrap: wrap; gap: 0.75rem 1.25rem;
            align-items: center;
        }
        .player-meta { display: flex; align-items: center; gap: 0.85rem; min-width: 0; flex: 1 1 240px; }
        .player-meta img {
            width: 52px; height: 52px; border-radius: 8px; object-fit: cover;
            border: 1px solid var(--border); flex-shrink: 0;
        }
        .player-titles { min-width: 0; }
        .player-titles .now { font-size: 0.8rem; color: var(--fg); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .player-titles .pos { font-size: 0.65rem; color: var(--fg-muted); letter-spacing: 0.08em; }
        .player-controls { display: flex; align-items: center; gap: 0.4rem; }
        .ctrl {
            background: transparent; border: 1px solid var(--border); color: var(--fg);
            width: 38px; height: 38px; border-radius: 50%;
            display: inline-flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s ease;
        }
        .ctrl:hover { border-color: var(--accent); color: var(--accent); }
        .ctrl-play { width: 46px; height: 46px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #0b0a10; border: none; }
        .ctrl svg { width: 16px; height: 16px; }
        .ctrl-play svg { width: 20px; height: 20px; }
        .player-close {
            background: transparent; border: none; color: var(--fg-muted);
            cursor: pointer; font-size: 1.1rem; padding: 0.25rem;
        }
        .player-close:hover { color: var(--accent-2); }
        /* native audio styling */
        audio { height: 36px; }

        /* Footer */
        .footer {
            margin-top: 2.5rem; text-align: center;
            color: var(--fg-muted); font-size: 0.7rem; letter-spacing: 0.1em;
        }

        /* Empty / loading state */
        .loading { text-align: center; color: var(--fg-muted); padding: 3rem; }
    </style>
</head>
<body>
    <div class="bg-image" aria-hidden="true"></div>
    <div class="bg-overlay" aria-hidden="true"></div>

    <main class="content">
        <div class="top-nav">
            <a href="index.html" class="back-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                Back to TDF Microvisions
            </a>
        </div>

        <header class="header">
            <img src="./mySongs/albumCover.png" alt="Apology Remastered album cover">
            <h1 class="font-display">Apology Remastered</h1>
            <p>Music from another world</p>
        </header>

        <!-- Playlist builder toolbar -->
        <div class="toolbar" role="region" aria-label="Playlist builder">
            <div class="toolbar-info">
                Playlist: <strong id="pl-count">0</strong> selected
            </div>
            <div class="toolbar-actions">
                <button class="btn" id="btn-all">Select All</button>
                <button class="btn" id="btn-none">Clear</button>
                <button class="btn btn-primary" id="btn-play" disabled>Play Playlist</button>
            </div>
        </div>

        <div id="grid" class="panels">
            <div class="loading">Loading songs…</div>
        </div>

        <footer class="footer">© 2026 David Pagett</footer>
    </main>

    <!-- Sticky playlist player -->
    <div class="player" id="player" aria-label="Playlist player">
        <div class="player-inner">
            <div class="player-meta">
                <img id="pl-cover" src="" alt="">
                <div class="player-titles">
                    <div class="now" id="pl-now">—</div>
                    <div class="pos" id="pl-pos"></div>
                </div>
            </div>
            <div class="player-controls">
                <button class="ctrl" id="pl-prev" title="Previous" aria-label="Previous">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/></svg>
                </button>
                <button class="ctrl ctrl-play" id="pl-playpause" title="Play/Pause" aria-label="Play or Pause">
                    <svg id="pl-icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pl-icon-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
                </button>
                <button class="ctrl" id="pl-next" title="Next" aria-label="Next">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
                </button>
            </div>
            <audio id="pl-audio" preload="metadata"></audio>
            <button class="player-close" id="pl-close" title="Close player" aria-label="Close player">✕</button>
        </div>
    </div>

    <script src="./mySongs/songs-data.js"></script>
    <script>
        const grid = document.getElementById('grid');
        const songs = Array.isArray(window.SONGS) ? window.SONGS : [];
        const selected = new Set();          // song ids
        let playlist = [];                    // ordered array of song objects
        let idx = 0;

        /* ---------- Render song cards ---------- */
        function snippet(text) {
            if (!text) return '';
            // Drop the leading markdown title if present, take first sentence-ish chunk.
            const clean = text.replace(/^#.*$/m, '').replace(/[\r\n]+/g, ' ').trim();
            return clean.split(/(?<=[.!?])\s+/)[0] || clean.slice(0, 140);
        }

        function renderCards() {
            if (!songs.length) {
                grid.innerHTML = '<div class="loading">No songs found.</div>';
                return;
            }
            grid.innerHTML = '';
            songs.forEach(song => {
                const cover = song.artwork[0] || './mySongs/albumCover.png';
                const card = document.createElement('a');
                card.className = 'card';
                card.href = `song.html?id=${encodeURIComponent(song.id)}`;
                card.dataset.id = song.id;
                card.innerHTML = `
                    <div class="card-cover">
                        <label class="card-select">
                            <input type="checkbox" data-id="${song.id}" aria-label="Add ${song.title} to playlist">
                            <span>Select</span>
                        </label>
                        <img src="${cover}" alt="Artwork for ${song.title}" loading="lazy">
                    </div>
                    <div class="card-body">
                        <div class="card-title">${song.title}</div>
                        <div class="card-snippet">${snippet(song.description)}</div>
                        <div class="card-open">View Song →</div>
                    </div>
                `;
                // Clicking the Select control should toggle the checkbox without
                // navigating the card link. preventDefault() blocks both the <a>
                // navigation AND the label's native toggle, so we flip the checkbox
                // ourselves and fire the change event — this guarantees a single,
                // consistent toggle regardless of where in the label the click landed.
                card.querySelector('.card-select').addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const cb = e.currentTarget.querySelector('input[type="checkbox"]');
                    cb.checked = !cb.checked;
                    cb.dispatchEvent(new Event('change', { bubbles: true }));
                });
                grid.appendChild(card);
            });

            // Wire up checkboxes
            grid.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                cb.addEventListener('change', () => toggleSelect(cb.dataset.id, cb.checked));
            });
        }

        /* ---------- Selection / playlist ---------- */
        function toggleSelect(id, on) {
            if (on) selected.add(id); else selected.delete(id);
            updateSelectionUI();
        }
        function selectAll(on) {
            if (on) songs.forEach(s => selected.add(s.id));
            else selected.clear();
            grid.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                cb.checked = on;
            });
            updateSelectionUI();
        }
        function updateSelectionUI() {
            document.getElementById('pl-count').textContent = selected.size;
            document.getElementById('btn-play').disabled = selected.size === 0;
            document.getElementById('btn-all').textContent = (selected.size === songs.length && songs.length) ? 'Deselect All' : 'Select All';
            // Highlight selected cards
            grid.querySelectorAll('.card').forEach(card => {
                card.classList.toggle('selected', selected.has(card.dataset.id));
            });
        }

        /* ---------- Playback ---------- */
        const audio = document.getElementById('pl-audio');
        const player = document.getElementById('player');
        const coverEl = document.getElementById('pl-cover');
        const nowEl = document.getElementById('pl-now');
        const posEl = document.getElementById('pl-pos');
        const iconPlay = document.getElementById('pl-icon-play');
        const iconPause = document.getElementById('pl-icon-pause');

        function buildPlaylist() {
            // Preserve the on-screen order of the songs.
            playlist = songs.filter(s => selected.has(s.id));
            idx = 0;
        }
        function loadCurrent(autoplay) {
            if (!playlist.length) return;
            const s = playlist[idx];
            coverEl.src = s.artwork[0] || './mySongs/albumCover.png';
            coverEl.alt = s.title;
            nowEl.textContent = s.title;
            posEl.textContent = `Track ${idx + 1} of ${playlist.length}`;
            audio.src = s.mp3;
            player.classList.add('visible');
            if (autoplay) audio.play().then(setPlayIcon(true)).catch(() => setPlayIcon(false));
            else setPlayIcon(false);
        }
        function setPlayIcon(isPlaying) {
            iconPlay.style.display = isPlaying ? 'none' : 'block';
            iconPause.style.display = isPlaying ? 'block' : 'none';
        }

        function startPlaylist() {
            if (!selected.size) return;
            buildPlaylist();
            loadCurrent(true);
        }

        document.getElementById('btn-all').addEventListener('click', () => {
            const allSelected = selected.size === songs.length && songs.length > 0;
            selectAll(!allSelected);
        });
        document.getElementById('btn-none').addEventListener('click', () => selectAll(false));
        document.getElementById('btn-play').addEventListener('click', startPlaylist);

        document.getElementById('pl-playpause').addEventListener('click', () => {
            if (audio.paused) audio.play().then(() => setPlayIcon(true)).catch(() => {});
            else { audio.pause(); setPlayIcon(false); }
        });
        document.getElementById('pl-prev').addEventListener('click', () => {
            if (!playlist.length) return;
            idx = (idx - 1 + playlist.length) % playlist.length;
            loadCurrent(true);
        });
        document.getElementById('pl-next').addEventListener('click', () => {
            if (!playlist.length) return;
            idx = (idx + 1) % playlist.length;
            loadCurrent(true);
        });
        document.getElementById('pl-close').addEventListener('click', () => {
            audio.pause(); player.classList.remove('visible');
        });
        audio.addEventListener('ended', () => {
            if (idx < playlist.length - 1) { idx++; loadCurrent(true); }
            else { setPlayIcon(false); }
        });
        audio.addEventListener('play', () => setPlayIcon(true));
        audio.addEventListener('pause', () => setPlayIcon(false));

        renderCards();
        updateSelectionUI();
    </script>
</body>
</html>
